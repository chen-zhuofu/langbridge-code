[project]
name = "langbridge"
version = "0.1.0"
description = "LangBridge — a general-purpose AI assistant with agentic workflows."
requires-python = ">=3.11"
dependencies = [
    "croniter>=6.0.0",
    "httpx>=0.28.1",
    "mcp>=1.26,<2",
    "numpy>=2.4.6",
    "openai>=2.41.1",
    "playwright>=1.55.0",
    "prompt-toolkit>=3.0.52",
]

[project.scripts]
langbridge = "langbridge_code.main:main"

# Package discovery lives in setup.py (flat src/ → import name langbridge_code).
[tool.setuptools]
include-package-data = true

[tool.uv]
default-groups = []

[tool.pytest.ini_options]
pythonpath = ["eval"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
langbridge_code = [
    "config.json",
    "skills/**/*.md",
    "skills/**/*.yaml",
    "prompt/**/*.md",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "torch>=2.12.0",
]
eval = [
    "datasets>=5.0.0",
    "swebench>=4.1.0",
]
